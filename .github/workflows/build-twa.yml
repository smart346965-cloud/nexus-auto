      - name: 🏗️ Final Build (Clean & Dynamic Signing)
        env:
          # جلب البيانات من Secrets
          KEY_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          
          # إرسال بيانات التوقيع كـ Parameters مباشرة للمحرك
          # هذه الطريقة تتجاوز أي إعدادات داخل الكود وتمنع التضارب
          ./gradlew assembleRelease \
            -Pandroid.signingConfigs.release.storeFile=$(pwd)/nexus-release-key.jks \
            -Pandroid.signingConfigs.release.storePassword=$KEY_PASS \
            -Pandroid.signingConfigs.release.keyAlias=$KEY_ALIAS \
            -Pandroid.signingConfigs.release.keyPassword=$KEY_PASS
