name: Nexus Auto-Build Engine
on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode Signing Key
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > nexus-release-key.jks

      - name: 🔍 Smart Debug & Nexus Build
        env:
          CLIENT_URL: ${{ github.event.client_payload.url }}
          CLIENT_NAME: ${{ github.event.client_payload.name }}
        run: |
          echo "🚀 بدء عملية تحليل النظام..."
          
          # 1. فحص وجود الملفات الأساسية
          if [ ! -f "twa-manifest.json" ]; then echo "❌ خطأ: ملف twa-manifest.json غير موجود في الجذر!"; exit 1; fi
          if [ ! -f "nexus-release-key.jks" ]; then echo "❌ خطأ: فشل فك تشفير مفتاح التوقيع (JKS)!"; exit 1; fi
          
          # 2. تنظيف الرابط باستخدام jq (آمن وموثوق)
          CLEAN_HOST=$(echo "$CLIENT_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          echo "✅ الدومين المستخرج: $CLEAN_HOST"
          
          # 3. تحديث manifest بشكل آمن باستخدام jq
          jq --arg host "$CLEAN_HOST" \
             --arg name "$CLIENT_NAME" \
             '.host = $host | .name = $name' \
             twa-manifest.json > temp.json
          
          mv temp.json twa-manifest.json
          
          # 4. فحص محتوى الملف بعد التعديل (للتأكد بصرياً)
          echo "📝 فحص محتوى المنيفست النهائي:"
          cat twa-manifest.json
          
          # 5. تشغيل البناء مع تفعيل خاصية الـ Verbose (التفصيل الممل)
          echo "🏗️ بدء بناء التطبيق..."
          bubblewrap build --manifest twa-manifest.json \
            --signingKeyPath nexus-release-key.jks \
            --signingKeyAlias "${{ secrets.KEY_ALIAS }}" \
            --signingKeyPassword "${{ secrets.KEY_STORE_PASSWORD }}" \
            --signingKeyStorePassword "${{ secrets.KEY_STORE_PASSWORD }}" \
            --skipConfig --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-apk
          path: ./*.apk

      - name: Upload AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-bundle
          path: ./*.aab
