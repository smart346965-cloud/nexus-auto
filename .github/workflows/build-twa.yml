name: Nexus Auto-Build Engine
on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode Signing Key
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > nexus-release-key.jks

      - name: Build TWA APK & AAB
        env:
          CLIENT_URL: ${{ github.event.client_payload.url }}
          CLIENT_NAME: ${{ github.event.client_payload.name }}
        run: |
          # 1. تحديث المنيفست باستخدام متغيرات البيئة (أكثر أماناً واستقراراً)
          sed -i "s|\"host\": \".*\"|\"host\": \"$CLIENT_URL\"|" twa-manifest.json
          sed -i "s|\"name\": \".*\"|\"name\": \"$CLIENT_NAME\"|" twa-manifest.json
          
          # 2. طباعة المنيفست للتأكد (اختياري للتصحيح)
          cat twa-manifest.json
          
          # 3. تشغيل عملية البناء الصامتة
          # ملاحظة: تم إزالة yes واستخدام الأعلام البرمجية الصحيحة
          bubblewrap build --manifest twa-manifest.json \
            --signingKeyPath nexus-release-key.jks \
            --signingKeyAlias "${{ secrets.KEY_ALIAS }}" \
            --signingKeyPassword "${{ secrets.KEY_STORE_PASSWORD }}" \
            --signingKeyStorePassword "${{ secrets.KEY_STORE_PASSWORD }}" \
            --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-apk
          path: ./*.apk

      - name: Upload AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-bundle
          path: ./*.aab
