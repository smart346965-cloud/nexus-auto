name: Nexus Auto-Build Engine

on:
  repository_dispatch:
    types: [build_app]
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط الموقع'
        required: true
        default: 'https://example.com'
      name:
        description: 'اسم التطبيق'
        required: true
        default: 'Nexus App'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java & Android
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # --- السطر السحري: جلب القالب النظيف ---
      - name: 🛠️ Setup Professional TWA Template
        run: |
          git clone https://github.com/GoogleChromeLabs/bubblewrap.git temp-build
          cp -r temp-build/packages/cli/test/data/project/* .
          rm -rf temp-build

      - name: 🧠 Logic: Inject Client Data
        env:
          CLIENT_URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
          CLIENT_NAME: ${{ github.event.inputs.name || github.event.client_payload.name }}
        run: |
          # استخراج الدومين وتنظيف البيانات
          CLEAN_HOST=$(echo "$CLIENT_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          
          # تعديل ملف twa-manifest.json (قلب تطبيق الـ TWA)
          jq --arg url "$CLIENT_URL" \
             --arg name "$CLIENT_NAME" \
             --arg host "$CLEAN_HOST" \
             '.host = $host | .name = $name | .launcherName = $name | .startUrl = "/"' \
             twa-manifest.json > temp.json && mv temp.json twa-manifest.json

      - name: 🔑 Prepare Signing Key
        run: |
          # فك تشفير مفتاحك الخاص (يجب أن يكون مخزناً كـ Base64 في Secrets)
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > nexus-release-key.jks

      - name: 🏗️ Pro Build (The Clean Execution)
        run: |
          chmod +x gradlew
          # تشغيل البناء وتوقيعه برمجياً
          ./gradlew assembleRelease \
            -Pandroid.signingConfigs.release.storeFile=$(pwd)/nexus-release-key.jks \
            -Pandroid.signingConfigs.release.storePassword=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.signingConfigs.release.keyAlias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.signingConfigs.release.keyPassword=${{ secrets.KEY_STORE_PASSWORD }}

      - name: 📦 Delivery: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.name || github.event.client_payload.name }}-APK
          path: app/build/outputs/apk/release/*.apk
