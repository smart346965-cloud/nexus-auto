name: Nexus Auto-Build Engine
on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: ☕ Setup Java (The Pro Way)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK (NEW SOLUTION)
        uses: android-actions/setup-android@v3
        with:
          build-tools: "34.0.0"
          api-level: "34"

      - name: 🔍 Smart Debug & Nexus Prep
        env:
          CLIENT_URL: ${{ github.event.client_payload.url }}
          CLIENT_NAME: ${{ github.event.client_payload.name }}
        run: |
          set -euxo pipefail

          CLEAN_HOST=$(echo "$CLIENT_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')

          SAFE_PACKAGE=$(echo "$CLEAN_HOST" | tr '.' '_' | tr '-' '_')

          PACKAGE_ID="com.nexus.${SAFE_PACKAGE}"

          echo "Host: $CLEAN_HOST"
          echo "Package: $PACKAGE_ID"

          jq \
            --arg host "$CLEAN_HOST" \
            --arg name "$CLIENT_NAME" \
            --arg package "$PACKAGE_ID" \
            '.host = $host |
             .name = $name |
             .launcherName = $name |
             .packageId = $package |
             .appVersionName = "1.0.0" |
             .appVersionCode = 1' \
             twa-manifest.json > temp.json

          mv temp.json twa-manifest.json

          echo "========== FINAL MANIFEST =========="
          cat twa-manifest.json

          mkdir -p ~/.bubblewrap

          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Decode Signing Key
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > nexus-release-key.jks

      - name: 🏗️ Final Build Execution
        run: |
          set -euxo pipefail

          echo "🚀 Nexus Build Started"

          bubblewrap build --manifest twa-manifest.json \
            --signingKeyPath nexus-release-key.jks \
            --signingKeyAlias "${{ secrets.KEY_ALIAS }}" \
            --signingKeyPassword "${{ secrets.KEY_STORE_PASSWORD }}" \
            --signingKeyStorePassword "${{ secrets.KEY_STORE_PASSWORD }}" \
            --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-apk
          path: ./*.apk

      - name: Upload AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-bundle
          path: ./*.aab
