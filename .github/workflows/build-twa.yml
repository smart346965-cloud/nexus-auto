name: Nexus Auto-Build Engine
on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode Signing Key
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > nexus-release-key.jks

      - name: Build TWA APK & AAB
        env:
          CLIENT_URL: ${{ github.event.client_payload.url }}
          CLIENT_NAME: ${{ github.event.client_payload.name }}
        run: |
          # 1. استخراج الـ Host فقط من الرابط (لأن المنيفست يحتاج الدومين فقط بدون https)
          CLEAN_HOST=$(echo $CLIENT_URL | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          
          # 2. تحديث المنيفست (تأكد من استخدام المزدوجة " وليس المفردة ')
          sed -i "s|\"host\": \".*\"|\"host\": \"$CLEAN_HOST\"|" twa-manifest.json
          sed -i "s|\"name\": \".*\"|\"name\": \"$CLIENT_NAME\"|" twa-manifest.json
          
          # 3. تشغيل البناء مع تجاوز الأسئلة التفاعلية
          bubblewrap build --manifest twa-manifest.json \
            --signingKeyPath nexus-release-key.jks \
            --signingKeyAlias "${{ secrets.KEY_ALIAS }}" \
            --signingKeyPassword "${{ secrets.KEY_STORE_PASSWORD }}" \
            --signingKeyStorePassword "${{ secrets.KEY_STORE_PASSWORD }}" \
            --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-apk
          path: ./*.apk

      - name: Upload AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-bundle
          path: ./*.aab
